[package]
name = "dexq"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
rkyv = "0.8.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
